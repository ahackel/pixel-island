<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scene areas mockup</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&display=swap" />
    <style>
      :root { color-scheme: dark; --desk: #1b1a24; --dot: #2a2836; --panel: #272434ee; --ink: #ece8f4; --dim: #9d97b0; --line: #3a3649; --accent: #f0b35a; --bad: #e0332e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--desk); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
      .tab { position: absolute; transform: translate(-50%, -100%); padding: 2px 8px 3px; border: 2px solid var(--line); border-radius: 6px 6px 0 0; background: #2f2c3d; color: var(--ink);
        font: 600 14px 'Pixelify Sans', system-ui; white-space: nowrap; cursor: grab; user-select: none; touch-action: none; display: flex; gap: 6px; align-items: baseline; }
      .tab small { color: var(--dim); font-weight: 500; font-size: 11px; }
      .tab.hot { border-color: #fff; }
      .tab.cave { background: #23264a; }
      .tab.bad { border-color: var(--bad); background: #4a1d1d; }
      .tab.dragging { cursor: grabbing; }
      .panel { position: absolute; left: 12px; top: 12px; width: 290px; max-width: calc(100% - 24px); padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
      .panel h1 { font: 600 16px 'Pixelify Sans', system-ui; margin: 0 0 2px; }
      .panel p { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
      .panel ul { margin: 0 0 10px; padding-left: 16px; font-size: 12px; }
      .panel li { margin: 2px 0; }
      .panel .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
      .panel button { background: #1d1b26; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
      .panel button:hover { border-color: var(--accent); }
      .panel.closed ul, .panel.closed p { display: none; }
      kbd { background: #1d1b26; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
      .status { position: absolute; left: 12px; bottom: 10px; padding: 3px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--dim); pointer-events: none; }
      .status b { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
