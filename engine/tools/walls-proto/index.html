<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plank walls prototype</title>
    <style>
      :root { color-scheme: dark; --bg: #1d1b26; --panel: #272434; --ink: #ece8f4; --dim: #9d97b0; --line: #3a3649; --accent: #f0b35a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
      .app { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; }
      aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 16px; overflow: auto; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.note { color: var(--dim); margin: 0 0 12px; font-size: 12.5px; }
      label.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; margin: 9px 0 0; }
      label.row span.v { color: var(--accent); font-variant-numeric: tabular-nums; }
      label.row > :nth-child(3) { grid-column: 1 / -1; }
      label.check { display: flex; gap: 8px; align-items: center; margin: 9px 0 0; }
      select, input[type='number'], button { background: #1d1b26; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      main { position: relative; overflow: hidden; background: #0d3b66; }
      .help { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12.5px; }
      kbd { background: #1d1b26; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
      @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45dvh; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside id="panel"></aside>
      <main></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
